services:
  redis:
    image: redis:7-alpine
    container_name: kew-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  kew:
    build: .
    container_name: kew
    depends_on:
      - redis
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      # Keep a durable job history (completed/failed), even when removeOnComplete
      # clears jobs from Redis. Stored in SQLite on the kew-data volume below.
      KEW_RETENTION: "1"
      # Set a secret to require login (recommended whenever this is reachable):
      # KEW_AUTH_TOKEN: change-me
      # KEW_AUTH_USER: you@example.com
    volumes:
      - kew-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  kew-data:
