name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Assert no premium code leaks into the OSS build
        run: |
          if grep -rE "@kew/premium-ui" packages/dashboard-ui/src apps/dashboard/src apps/dashboard/dist; then
            echo "::error::premium reference found in the OSS source or build output"
            exit 1
          fi
          echo "OK: zero premium references in OSS source and build"
      - run: bun run test
        env:
          TEST_REDIS_URL: redis://localhost:6379
